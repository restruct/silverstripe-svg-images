---
Name: svgassetsfiletype
After: '#assetsfiletypes'
---
# Convert SVG uploads to SVGImage class automatically
SilverStripe\Assets\File:
  extensions:
    - Restruct\Silverstripe\SVG\SVGImageExtension
  file_types:
    svg: 'SVG Image'
  allowed_extensions:
    - svg
  app_categories:
    image:
      - svg
    image/supported:
      - svg
  class_for_file_extension:
    svg: Restruct\Silverstripe\SVG\SVGImage

SilverStripe\Assets\Storage\DBFile:
  supported_images:
    - image/svg
    # The MIME type actually stored for an .svg upload (#28). With only image/svg, an original
    # SVGImage (forTemplate, StripThumbnail, CMSThumbnail) rendered through its plain DBFile as a
    # download link; variants were fine because SVGDBFile::getIsImage() works around it.
    - image/svg+xml

# SVGs opened as a document can run script on the site's origin (#23). SVG responses get a
# Content-Security-Policy with `sandbox`: those Silverstripe streams through FlysystemAssetStore
# (protected/draft files) through this extension, public ones Apache serves through the
# assets/.htaccess this template generates (core's template plus the SVG headers; regenerated on
# flush). Not covered here: nginx (ignores .htaccess), a project's own .htaccess template, and
# modules that serve protected files another way. See README.
SilverStripe\Assets\Flysystem\FlysystemAssetStore:
  extensions:
    - Restruct\Silverstripe\SVG\Extensions\SVGResponseHeadersExtension

SilverStripe\Assets\Flysystem\PublicAssetAdapter:
  server_configuration:
    apache:
      '.htaccess': Restruct\Silverstripe\SVG\PublicAssetAdapter_HTAccess

# Optionally uncomment this to have has_one images loaded as SVG in case of .svg extension
# You would also need to hack the core framework's ForeignKey class for this to work, see README
# SilverStripe\Core\Injector\Injector:
#  SilverStripe\Assets\Image:
#    class: Restruct\Silverstripe\SVG\SVGImage

# An SVG must never reach the raster Image_Backend (#24). Core builds every Image_Backend through
# the ImageBackendFactory service; this subclass hands SVG containers a backend that never
# decodes. Covers plain Image/DBFile objects holding an SVG (an UploadField upload into a has_one
# Image, before its ClassName is corrected); SVGImage/SVGDBFile also override getImageBackend().
---
Name: svgimagebackendfactory
After: '#assetsimage'
---
SilverStripe\Core\Injector\Injector:
  SilverStripe\Assets\ImageBackendFactory:
    class: Restruct\Silverstripe\SVG\SVGImageBackendFactory

---
Name: svgmimevalidator
After: '#mimevalidator'
Only:
  moduleexists: silverstripe/mimevalidator
---
SilverStripe\MimeValidator\MimeUploadValidator:
  MimeTypes:
    svg:
      - image/svg

# /dev/svg-compare is registered with DevelopmentAdmin, whose config key and shape changed in
# Silverstripe 6: `registered_controllers` (controller + links) became `controllers` (class +
# description). PolyOutput exists only on SS6, so it selects the right fragment per major.
---
Name: svgcompare-dev
Except:
  classexists: 'SilverStripe\PolyExecution\PolyOutput'
---
SilverStripe\Dev\DevelopmentAdmin:
  registered_controllers:
    svg-compare:
      controller: Restruct\Silverstripe\SVG\Controllers\SVGCompareController
      links:
        svg-compare: 'Compare SVG vs raster image manipulations'

---
Name: svgcompare-dev-ss6
Only:
  classexists: 'SilverStripe\PolyExecution\PolyOutput'
---
SilverStripe\Dev\DevelopmentAdmin:
  controllers:
    svg-compare:
      class: Restruct\Silverstripe\SVG\Controllers\SVGCompareController
      description: 'Compare SVG vs raster image manipulations'
